<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Encuesta para Comercios · Sucrédito</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --amarillo:#FFEE00;
    --amarillo-oscuro:#E6D600;
    --negro:#14120C;
    --rojo:#E4032E;
    --rojo-oscuro:#A80121;
    --crema:#FFFDF3;
    --gris:#6b6659;
    --verde:#0E9F6E;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{-webkit-text-size-adjust:100%;}
  body{
    font-family:'Inter', Arial, sans-serif;
    background:var(--amarillo);
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    color:var(--negro);
  }

  /* ===== Header ===== */
  header{
    width:100%;
    background:var(--amarillo);
    padding:18px 22px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    border-bottom:5px solid var(--negro);
    position:sticky;
    top:0;
    z-index:50;
  }
  .logo-header{
    height:36px;
    display:block;
    position:relative;
    z-index:10000;
  }
  .header-tag{
    font-size:10.5px;
    font-weight:800;
    text-transform:uppercase;
    letter-spacing:.6px;
    color:rgba(20,18,12,0.55);
    background:rgba(20,18,12,0.08);
    padding:6px 10px;
    border-radius:20px;
  }

  body.intro-cargando main,
  body.intro-cargando footer.footer-marca{
    opacity:0;
    visibility:hidden;
  }
  body.intro-lista main,
  body.intro-lista footer.footer-marca{
    opacity:1;
    visibility:visible;
    transition:opacity .3s ease;
  }
  body.intro-cargando{ overflow:hidden; }

  main{
    width:100%;
    max-width:560px;
    flex:1;
    padding:26px 20px 40px;
  }

  /* ===== Barra de progreso ===== */
  .progreso-wrap{
    margin-bottom:20px;
  }
  .progreso-filas{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    margin-bottom:8px;
  }
  .progreso-label{
    font-family:'Archivo Black', sans-serif;
    font-size:12px;
    color:var(--rojo);
    letter-spacing:.4px;
    text-transform:uppercase;
  }
  .progreso-pct{
    font-size:12px;
    font-weight:800;
    color:var(--gris);
  }
  .progreso-barra{
    height:9px;
    background:rgba(20,18,12,0.1);
    border-radius:20px;
    border:1.5px solid var(--negro);
    overflow:hidden;
  }
  .progreso-fill{
    height:100%;
    background:var(--rojo);
    border-radius:20px;
    width:0%;
    transition:width .35s cubic-bezier(.22,1,.36,1);
  }

  .paso{ display:none; }
  .paso.visible{ display:block; }

  .tarjeta{
    background:var(--crema);
    border:3px solid var(--negro);
    border-radius:16px;
    padding:28px 24px;
    box-shadow:7px 7px 0 var(--negro);
    animation:apareceCard .35s ease;
  }
  @keyframes apareceCard{
    from{ opacity:0; transform:translateY(14px); }
    to{ opacity:1; transform:translateY(0); }
  }

  .intro h1{
    font-family:'Archivo Black', sans-serif;
    font-size:23px;
    line-height:1.28;
    margin-bottom:12px;
  }
  .intro p{
    font-size:14.5px;
    color:var(--gris);
    font-weight:600;
    line-height:1.55;
    margin-bottom:18px;
  }
  .intro-meta{
    display:flex;
    gap:10px;
    margin-bottom:18px;
    flex-wrap:wrap;
  }
  .intro-meta span{
    font-size:12px;
    font-weight:800;
    background:rgba(20,18,12,0.06);
    border:1.5px solid rgba(20,18,12,0.15);
    border-radius:20px;
    padding:6px 12px;
    display:inline-flex;
    align-items:center;
    gap:6px;
  }
  .contador{
    font-size:12px;
    font-weight:800;
    color:var(--rojo);
    letter-spacing:1px;
    margin-bottom:10px;
    text-transform:uppercase;
  }
  .pregunta{
    font-family:'Archivo Black', sans-serif;
    font-size:18.5px;
    line-height:1.32;
    margin-bottom:16px;
  }
  .pregunta .req{ color:var(--rojo); }
  .subnota{
    font-size:12.5px;
    color:var(--gris);
    font-weight:700;
    margin:-8px 0 16px;
    display:flex;
    align-items:center;
    gap:6px;
  }
  .subnota .contador-sel{
    background:rgba(228,3,46,0.1);
    color:var(--rojo);
    border-radius:20px;
    padding:2px 9px;
    font-weight:800;
  }

  .opciones{ display:flex; flex-direction:column; gap:10px; }
  .opcion{
    border:2.5px solid var(--negro);
    border-radius:10px;
    padding:13px 16px;
    font-size:14.5px;
    font-weight:700;
    color:var(--negro);
    background:var(--crema);
    cursor:pointer;
    text-align:left;
    display:flex;
    align-items:center;
    gap:10px;
    box-shadow:0 0 0 var(--negro);
    transition:background .15s ease, color .15s ease, transform .15s ease, box-shadow .15s ease;
  }
  .opcion .check{
    width:19px;
    height:19px;
    min-width:19px;
    border-radius:6px;
    border:2px solid var(--negro);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:12px;
    background:var(--crema);
    transition:background .15s ease, border-color .15s ease;
  }
  .opcion.circulo .check{ border-radius:50%; }
  .opcion:hover{
    background:#fff6b8;
    transform:translate(-2px,-2px);
    box-shadow:3px 3px 0 var(--negro);
  }
  .opcion:active{ transform:scale(.97); }
  .opcion.seleccionada{
    background:var(--negro);
    color:var(--amarillo);
    border-color:var(--negro);
    animation:popSeleccion .28s ease;
  }
  .opcion.seleccionada .check{
    background:var(--rojo);
    border-color:var(--rojo);
    color:var(--crema);
  }
  .opcion.deshabilitada{ opacity:.4; cursor:not-allowed; }
  .opcion.deshabilitada:hover{
    background:var(--crema);
    transform:none;
    box-shadow:0 0 0 var(--negro);
  }
  @keyframes popSeleccion{
    0%{ transform:scale(1); }
    45%{ transform:scale(1.04); }
    100%{ transform:scale(1); }
  }
  @keyframes sacudeLimite{
    0%, 100%{ transform:translateX(0); }
    25%{ transform:translateX(-4px); }
    75%{ transform:translateX(4px); }
  }
  .opcion.limite{ animation:sacudeLimite .25s ease; }

  .otro-input{
    display:none;
    margin-top:10px;
    width:100%;
    border:2.5px solid var(--negro);
    border-radius:10px;
    padding:12px 14px;
    font-size:14px;
    font-family:'Inter', sans-serif;
    font-weight:600;
  }
  .otro-input.visible{
    display:block;
    animation:apareceCard .25s ease;
  }

  textarea, input[type=email], input[type=text].campo-simple, input[type=tel]{
    width:100%;
    border:2.5px solid var(--negro);
    border-radius:10px;
    padding:13px 14px;
    font-size:14.5px;
    font-family:'Inter', sans-serif;
    font-weight:600;
    resize:vertical;
    min-height:100px;
    transition:box-shadow .15s ease;
  }
  input[type=email], input[type=text].campo-simple, input[type=tel]{ min-height:unset; }
  textarea:focus, input[type=email]:focus, input[type=text].campo-simple:focus, input[type=tel]:focus, .otro-input:focus{
    outline:none;
    box-shadow:3px 3px 0 var(--negro);
  }
  .contador-caracteres{
    text-align:right;
    font-size:11.5px;
    color:var(--gris);
    font-weight:700;
    margin-top:6px;
  }

  .campo-grupo{ margin-bottom:16px; }
  .campo-grupo:last-child{ margin-bottom:0; }
  .campo-label{
    display:block;
    font-size:12.5px;
    font-weight:800;
    color:var(--gris);
    text-transform:uppercase;
    letter-spacing:.5px;
    margin-bottom:8px;
  }
  .campo-ayuda{
    font-size:12px;
    color:var(--gris);
    font-weight:600;
    margin-top:6px;
  }

  .nav{
    display:flex;
    justify-content:center;
    align-items:center;
    margin-top:22px;
    gap:10px;
  }
  .btn{
    border:none;
    border-radius:10px;
    padding:14px 22px;
    font-family:'Archivo Black', sans-serif;
    font-size:14px;
    cursor:pointer;
  }
  .btn-siguiente{
    background:var(--rojo);
    color:var(--crema);
    flex:1;
    box-shadow:0 4px 0 var(--rojo-oscuro);
    transition:transform .08s ease, box-shadow .08s ease, opacity .15s ease;
  }
  .btn-siguiente:hover:not(:disabled){ filter:brightness(1.05); }
  .btn-siguiente:active:not(:disabled){ transform:translateY(3px); box-shadow:none; }
  .btn-siguiente:disabled{ opacity:.35; cursor:not-allowed; }
  .btn-atras{
    background:transparent;
    color:var(--negro);
    font-weight:800;
    font-family:'Inter', sans-serif;
    padding:14px 6px;
    transition:opacity .15s ease;
  }
  .btn-atras:hover{ opacity:.6; }
  .btn-saltar{
    background:transparent;
    color:var(--gris);
    font-weight:700;
    font-family:'Inter', sans-serif;
    font-size:12.5px;
    text-decoration:underline;
    padding:8px 4px;
    cursor:pointer;
    margin-top:12px;
    display:none;
  }
  .btn-saltar.visible{ display:inline-block; }

  .error-msg{
    display:none;
    color:var(--rojo-oscuro);
    background:rgba(228,3,46,0.08);
    border:1.5px solid rgba(228,3,46,0.35);
    border-radius:8px;
    padding:9px 12px;
    font-size:12.5px;
    font-weight:700;
    margin-top:12px;
  }
  .error-msg.visible{ display:block; animation:apareceCard .2s ease; }

  .final{ text-align:center; }
  .final .icono-wrap{
    width:74px;
    height:74px;
    border-radius:50%;
    background:var(--amarillo);
    border:3px solid var(--negro);
    display:flex;
    align-items:center;
    justify-content:center;
    margin:2px auto 18px;
    animation:popSeleccion .5s ease;
  }
  .final .icono{ font-size:34px; }
  .final h2{
    font-family:'Archivo Black', sans-serif;
    font-size:21px;
    margin-bottom:10px;
  }
  .final p{
    color:var(--gris);
    font-size:14px;
    font-weight:600;
    line-height:1.55;
  }
  .confeti-pieza{
    position:fixed;
    top:-20px;
    width:9px;
    height:14px;
    z-index:999;
    pointer-events:none;
    animation-name:caerConfeti;
    animation-timing-function:linear;
    animation-fill-mode:forwards;
  }
  @keyframes caerConfeti{
    0%{ transform:translateY(0) rotate(0deg); opacity:1; }
    100%{ transform:translateY(110vh) rotate(600deg); opacity:0.9; }
  }

  footer.footer-marca{
    max-width:560px;
    margin:20px 20px 30px;
    text-align:center;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-wrap:wrap;
    gap:6px;
  }
  footer.footer-marca .footer-marca-grupo{
    display:inline-flex;
    align-items:center;
    gap:6px;
    white-space:nowrap;
  }
  footer.footer-marca span.texto{
    font-family:'Archivo Black', sans-serif;
    font-size:12px;
    color:rgba(20,18,12,0.55);
    letter-spacing:.4px;
  }

  @media (max-width:380px){
    .pregunta{ font-size:17px; }
    .tarjeta{ padding:22px 18px; }
  }
</style>
</head>

      { valor: 'Promociones subsidiadas' },
      { valor: 'Acciones de marketing conjuntas' },
      { valor: 'Información sobre comportamiento de clientes' },
      { valor: 'Otra', otro: true }
    ]
  },
  {
    id: 'interes_promos_especiales',
    tipo: 'single',
    requerido: true,
    texto: 'Si Sucrédito ofreciera promociones especiales para tu comercio con un costo conveniente, ¿te interesaría participar?',
    opciones: [
      { valor: 'Sí' },
      { valor: 'No' },
      { valor: 'Tal vez' },
      { valor: 'Dependería de las condiciones' }
    ]
  },
  {
    id: 'que_deberia_ofrecer',
    tipo: 'texto',
    requerido: true,
    texto: '¿Qué debería ofrecer Sucrédito para que la priorices frente a otros medios de pago?',
    placeholder: 'Contanos con tus palabras...',
    maxlength: 400
  },
  {
    id: 'mejora_unica',
    tipo: 'texto',
    requerido: false,
    texto: 'Si pudieras pedirle UNA sola mejora a Sucrédito para ayudar a los comercios a vender más, ¿cuál sería?',
    placeholder: 'Opcional, pero nos ayuda mucho...',
    maxlength: 400
  }
];

const TOTAL_PREGUNTAS = PREGUNTAS.length;
/* Índices de paso: 0 = intro | 1..N = preguntas | N+1 = datos de contacto | N+2 = final */
const PASO_CONTACTO = TOTAL_PREGUNTAS + 1;
const PASO_FINAL = TOTAL_PREGUNTAS + 2;

const respuestas = {};
let pasoActual = 0;

const contenedor = document.getElementById('contenedorPasos');

function crearIntro(){
  const div = document.createElement('div');
  div.className = 'paso';
  div.dataset.paso = '0';
  div.innerHTML = `
    <div class="tarjeta intro">
      <h1>Ayudanos a mejorar Sucrédito para tu comercio 🏪</h1>
      <p>Tu opinión nos permite diseñar mejores condiciones, promociones y herramientas para que vendas más. Son ${TOTAL_PREGUNTAS} preguntas rápidas.</p>
      <div class="intro-meta">
        <span>⏱️ 3-4 minutos</span>
        <span>📊 ${TOTAL_PREGUNTAS} preguntas</span>
      </div>
    </div>`;
  return div;
}

function crearPreguntaDOM(pregunta, indice){
  const div = document.createElement('div');
  div.className = 'paso';
  div.dataset.paso = String(indice + 1);
  div.dataset.campo = pregunta.id;

  const contador = `<div class="contador">Pregunta ${indice + 1} de ${TOTAL_PREGUNTAS}</div>`;
  const reqMark = pregunta.requerido ? '' : ' <span style="color:var(--gris); font-weight:700; font-size:12.5px;">(opcional)</span>';
  const preguntaHtml = `<div class="pregunta">${pregunta.texto}${reqMark}</div>`;

  let cuerpo = '';

  if(pregunta.tipo === 'single' || pregunta.tipo === 'multi'){
    const esMulti = pregunta.tipo === 'multi';
    const subnota = esMulti
      ? `<div class="subnota">Podés elegir hasta ${pregunta.max} opciones <span class="contador-sel" data-contador="${pregunta.id}">0/${pregunta.max}</span></div>`
      : '';
    const botones = pregunta.opciones.map(op => {
      const claseCirc = esMulti ? '' : ' circulo';
      const marca = esMulti ? '✓' : '';
      return `<button type="button" class="opcion${claseCirc}" data-valor="${escapeHtml(op.valor)}" ${op.otro ? 'data-otro="1"' : ''}>
        <span class="check">${marca}</span><span>${escapeHtml(op.valor)}</span>
      </button>`;
    }).join('');
    const tieneOtro = pregunta.opciones.some(o => o.otro);
    cuerpo = `
      ${subnota}
      <div class="opciones" data-campo="${pregunta.id}" data-tipo="${pregunta.tipo}" data-max="${pregunta.max || 1}">
        ${botones}
      </div>
      ${tieneOtro ? `<input type="text" class="otro-input" data-campo-otro="${pregunta.id}" placeholder="Contanos cuál...">` : ''}
      <div class="error-msg" data-error="${pregunta.id}">Elegí al menos una opción para continuar.</div>`;
  } else if(pregunta.tipo === 'texto'){
    cuerpo = `
      <textarea data-campo="${pregunta.id}" maxlength="${pregunta.maxlength || 500}" placeholder="${pregunta.placeholder || ''}"></textarea>
      <div class="contador-caracteres"><span data-cuenta="${pregunta.id}">0</span>/${pregunta.maxlength || 500}</div>
      <div class="error-msg" data-error="${pregunta.id}">Contanos brevemente tu respuesta para continuar.</div>`;
  }

  div.innerHTML = `<div class="tarjeta">${contador}${preguntaHtml}${cuerpo}</div>`;
  return div;
}

function crearContactoDOM(){
  const div = document.createElement('div');
  div.className = 'paso';
  div.dataset.paso = String(PASO_CONTACTO);
  div.innerHTML = `
    <div class="tarjeta">
      <div class="contador">Último paso</div>
      <div class="pregunta">Dejanos los datos de tu comercio</div>
      <div class="campo-grupo">
        <label class="campo-label" for="campoNombreComercio">Nombre del comercio</label>
        <input type="text" id="campoNombreComercio" class="campo-simple" data-campo="nombre_comercio" placeholder="Ej: Zapatería Don José">
      </div>
      <div class="campo-grupo">
        <label class="campo-label" for="campoEmailComercio">Email</label>
        <input type="email" id="campoEmailComercio" data-campo="email" placeholder="tu@email.com">
      </div>
      <div class="campo-grupo">
        <label class="campo-label" for="campoTelefonoComercio">Teléfono <span style="text-transform:none; font-weight:600;">(opcional)</span></label>
        <input type="tel" id="campoTelefonoComercio" class="campo-simple" data-campo="telefono" placeholder="Ej: 381 000 0000">
      </div>
      <div class="error-msg" data-error="contacto">Completá al menos el nombre del comercio y un email válido.</div>
    </div>`;
  return div;
}

function crearFinalDOM(){
  const div = document.createElement('div');
  div.className = 'paso final';
  div.dataset.paso = String(PASO_FINAL);
  div.innerHTML = `
    <div class="tarjeta">
      <div class="icono-wrap"><span class="icono">🙌</span></div>
      <h2>¡Muchas gracias!</h2>
      <p>Gracias por compartir tu información con nosotros. Tu opinión nos ayuda a construir un Sucrédito más útil para tu comercio.</p>
    </div>`;
  return div;
}

/* Construcción del DOM */
contenedor.appendChild(crearIntro());
PREGUNTAS.forEach((p, i) => contenedor.appendChild(crearPreguntaDOM(p, i)));
contenedor.appendChild(crearContactoDOM());
contenedor.appendChild(crearFinalDOM());

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

const pasosEls = () => Array.from(document.querySelectorAll('.paso'));

function pintarProgreso(){
  const wrap = document.getElementById('progresoWrap');
  const label = document.getElementById('progresoLabel');
  const pct = document.getElementById('progresoPct');
  const fill = document.getElementById('progresoFill');

  if(pasoActual === 0){
    wrap.style.visibility = 'hidden';
    return;
  }
  wrap.style.visibility = 'visible';

  if(pasoActual >= 1 && pasoActual <= TOTAL_PREGUNTAS){
    label.textContent = `Pregunta ${pasoActual} de ${TOTAL_PREGUNTAS}`;
  } else if(pasoActual === PASO_CONTACTO){
    label.textContent = 'Tus datos';
  } else {
    label.textContent = '¡Completado!';
  }

  const avance = Math.min(pasoActual, PASO_CONTACTO) / PASO_CONTACTO * 100;
  pct.textContent = Math.round(avance) + '%';
  fill.style.width = avance + '%';
}

function lanzarConfeti(){
  const colores = ['#E4032E', '#FFEE00', '#14120C', '#FFFDF3', '#A80121'];
  const cantidad = 60;
  for(let i=0;i<cantidad;i++){
    const pieza = document.createElement('div');
    pieza.className = 'confeti-pieza';
    pieza.style.left = Math.random()*100 + 'vw';
    pieza.style.background = colores[Math.floor(Math.random()*colores.length)];
    const duracion = 2.2 + Math.random()*1.6;
    const retraso = Math.random()*0.5;
    pieza.style.animationDuration = duracion + 's';
    pieza.style.animationDelay = retraso + 's';
    pieza.style.transform = 'rotate(' + Math.floor(Math.random()*360) + 'deg)';
    document.body.appendChild(pieza);
    setTimeout(()=>pieza.remove(), (duracion+retraso)*1000 + 200);
  }
}

function ocultarError(id){
  const err = document.querySelector(`[data-error="${id}"]`);
  if(err) err.classList.remove('visible');
}
function mostrarError(id){
  const err = document.querySelector(`[data-error="${id}"]`);
  if(err) err.classList.add('visible');
}

function mostrarPaso(i){
  pasosEls().forEach(p => p.classList.remove('visible'));
  const actual = document.querySelector(`.paso[data-paso="${i}"]`);
  if(actual) actual.classList.add('visible');

  const btnAtras = document.getElementById('btnAtras');
  btnAtras.style.display = (i===0) ? 'none' : 'inline-block';

  const btnSig = document.getElementById('btnSiguiente');
  if(i === PASO_FINAL){
    document.getElementById('navegacion').style.display = 'none';
    lanzarConfeti();
  } else {
    document.getElementById('navegacion').style.display = 'flex';
    if(i === 0){
      btnSig.textContent = 'Comenzar';
      btnSig.disabled = false;
    } else if(i === PASO_CONTACTO){
      btnSig.textContent = 'Enviar';
      btnSig.disabled = !contactoValido();
    } else {
      btnSig.textContent = 'Siguiente';
      btnSig.disabled = !preguntaValida(i);
    }
  }
  pintarProgreso();
}

function preguntaDe(indicePaso){
  return PREGUNTAS[indicePaso - 1];
}

function preguntaValida(indicePaso){
  const p = preguntaDe(indicePaso);
  if(!p) return true;
  if(!p.requerido) return true;
  const val = respuestas[p.id];
  if(p.tipo === 'multi') return Array.isArray(val) && val.length > 0;
  if(p.tipo === 'texto') return typeof val === 'string' && val.trim().length > 0;
  return !!val;
}

function contactoValido(){
  const nombre = (respuestas['nombre_comercio'] || '').trim();
  const email = (respuestas['email'] || '').trim();
  return nombre.length > 1 && email.length > 3 && email.includes('@') && email.includes('.');
}

/* ===== Eventos: opciones single/multi ===== */
document.querySelectorAll('.opciones').forEach(cont => {
  const nombre = cont.dataset.campo;
  const tipo = cont.dataset.tipo;
  const max = parseInt(cont.dataset.max, 10) || 1;

  cont.querySelectorAll('button.opcion').forEach(btn => {
    btn.addEventListener('click', () => {
      const pasoDiv = cont.closest('.paso');
      const idPaso = parseInt(pasoDiv.dataset.paso, 10);
      const otroInput = pasoDiv.querySelector(`[data-campo-otro="${nombre}"]`);

      if(tipo === 'multi'){
        const yaSeleccionado = btn.classList.contains('seleccionada');
        const seleccionadasActuales = cont.querySelectorAll('button.seleccionada').length;

        if(!yaSeleccionado && seleccionadasActuales >= max){
          btn.classList.add('limite');
          setTimeout(()=>btn.classList.remove('limite'), 250);
          return;
        }

        btn.classList.toggle('seleccionada');
        btn.querySelector('.check').textContent = btn.classList.contains('seleccionada') ? '✓' : '';

        const seleccionadas = cont.querySelectorAll('button.seleccionada');
        respuestas[nombre] = Array.from(seleccionadas).map(b => b.dataset.valor);

        const alTope = seleccionadas.length >= max;
        cont.querySelectorAll('button.opcion').forEach(b => {
          if(!b.classList.contains('seleccionada')) b.classList.toggle('deshabilitada', alTope);
        });

        const contadorEl = document.querySelector(`[data-contador="${nombre}"]`);
        if(contadorEl) contadorEl.textContent = `${seleccionadas.length}/${max}`;

        if(otroInput){
          const otroSel = Array.from(seleccionadas).some(b => b.dataset.otro);
          otroInput.classList.toggle('visible', otroSel);
          if(otroSel && btn.dataset.otro) otroInput.focus();
          if(!otroSel) otroInput.value = '';
        }
      } else {
        cont.querySelectorAll('button.opcion').forEach(b => {
          b.classList.remove('seleccionada');
          b.querySelector('.check').textContent = '';
        });
        btn.classList.add('seleccionada');
        btn.querySelector('.check').textContent = '●';
        respuestas[nombre] = btn.dataset.valor;

        if(otroInput){
          if(btn.dataset.otro){
            otroInput.classList.add('visible');
            otroInput.focus();
          } else {
            otroInput.classList.remove('visible');
            otroInput.value = '';
          }
        }
      }

      ocultarError(nombre);
      actualizarBoton();
    });
  });
});

/* ===== Eventos: texto libre, "otro", y datos de contacto ===== */
document.querySelectorAll('textarea[data-campo]').forEach(campo => {
  campo.addEventListener('input', () => {
    respuestas[campo.dataset.campo] = campo.value;
    const cuentaEl = document.querySelector(`[data-cuenta="${campo.dataset.campo}"]`);
    if(cuentaEl) cuentaEl.textContent = campo.value.length;
    ocultarError(campo.dataset.campo);
    actualizarBoton();
  });
});

document.querySelectorAll('input.otro-input').forEach(campo => {
  campo.addEventListener('input', () => {
    respuestas[campo.dataset.campoOtro + '_detalle'] = campo.value;
  });
});

document.querySelectorAll('#campoNombreComercio, #campoEmailComercio, #campoTelefonoComercio').forEach(campo => {
  campo.addEventListener('input', () => {
    respuestas[campo.dataset.campo] = campo.value;
    ocultarError('contacto');
    actualizarBoton();
  });
});

function actualizarBoton(){
  const btnSig = document.getElementById('btnSiguiente');
  if(pasoActual === 0) return;
  if(pasoActual === PASO_CONTACTO){
    btnSig.disabled = !contactoValido();
  } else if(pasoActual >= 1 && pasoActual <= TOTAL_PREGUNTAS){
    btnSig.disabled = !preguntaValida(pasoActual);
  }
}

document.getElementById('btnAtras').addEventListener('click', () => {
  if(pasoActual > 0){ pasoActual--; mostrarPaso(pasoActual); }
});

document.getElementById('btnSiguiente').addEventListener('click', async () => {
  if(pasoActual >= 1 && pasoActual <= TOTAL_PREGUNTAS){
    if(!preguntaValida(pasoActual)){
      const p = preguntaDe(pasoActual);
      mostrarError(p.id);
      return;
    }
  }
  if(pasoActual === PASO_CONTACTO && !contactoValido()){
    mostrarError('contacto');
    return;
  }

  if(pasoActual < PASO_CONTACTO){
    pasoActual++;
    mostrarPaso(pasoActual);
  } else {
    const btn = document.getElementById('btnSiguiente');
    btn.disabled = true;
    btn.textContent = 'Enviando...';

    function textoDeCampo(pregunta){
      const val = respuestas[pregunta.id];
      const detalleOtro = (respuestas[pregunta.id + '_detalle'] || '').trim();
      if(Array.isArray(val)){
        if(val.length === 0) return '';
        return val.map(v => (v === 'Otro' || v === 'Otra' || v === 'Otros') && detalleOtro ? `${v}: ${detalleOtro}` : v).join('; ');
      }
      if((val === 'Otro' || val === 'Otra' || val === 'Otros') && detalleOtro) return `${val}: ${detalleOtro}`;
      return val || '';
    }

    const payload = { fecha: new Date().toISOString() };
    PREGUNTAS.forEach(p => { payload[p.id] = textoDeCampo(p); });
    payload.nombre_comercio = respuestas['nombre_comercio'] || '';
    payload.email = respuestas['email'] || '';
    payload.telefono = respuestas['telefono'] || '';

    try{
      await fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: {'Content-Type': 'text/plain'},
        body: JSON.stringify(payload)
      });
    }catch(e){
      console.error('Error enviando encuesta', e);
    }

    pasoActual = PASO_FINAL;
    mostrarPaso(pasoActual);
  }
});

mostrarPaso(pasoActual);

/* ===== Entrada animada del logo: aparece grande al centro y se acomoda arriba a la izquierda ===== */
function iniciarEntrada(){
  const logo = document.querySelector('.logo-header');
  if(!logo) return;

  const terminar = ()=>{
    logo.style.transform = 'none';
    logo.style.willChange = 'auto';
    document.body.classList.remove('intro-cargando');
    document.body.classList.add('intro-lista');
  };

  if(window.matchMedia('(prefers-reduced-motion: reduce)').matches){
    terminar();
    return;
  }

  // Medimos la posición REAL del logo dentro del header.
  // Se mueve únicamente con transform: no rompe el layout
  // ni se superpone con el resto del header al finalizar.
  const destino = logo.getBoundingClientRect();
  const centroLogoX = destino.left + destino.width / 2;
  const centroLogoY = destino.top + destino.height / 2;
  const dx = (window.innerWidth / 2) - centroLogoX;
  const dy = (window.innerHeight / 2) - centroLogoY;

  // Aparece inmediatamente en el centro, agrandado, y queda allí un instante.
  logo.style.willChange = 'transform';
  logo.style.transformOrigin = 'center center';
  logo.style.transform = `translate(${dx}px, ${dy}px) scale(2.35)`;
  logo.getBoundingClientRect();

  // Después se acomoda de forma corta y fluida en su lugar real.
  setTimeout(()=>{
    const animacion = logo.animate([
      { transform: `translate(${dx}px, ${dy}px) scale(2.35)` },
      { transform: 'translate(0, 0) scale(1)' }
    ], {
      duration: 620,
      easing: 'cubic-bezier(.22, 1, .36, 1)',
      fill: 'forwards'
    });

    animacion.onfinish = terminar;
    animacion.oncancel = terminar;
  }, 950);
}

if(document.readyState === 'loading'){
  document.addEventListener('DOMContentLoaded', iniciarEntrada, {once:true});
} else {
  iniciarEntrada();
}
</script>
